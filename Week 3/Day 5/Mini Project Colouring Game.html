<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colouring Game</title>
  <style>
    :root {
      --ink: #20252b;
      --muted: #68727d;
      --paper: #fffdf8;
      --panel: #ffffff;
      --line: #dfe4e8;
      --accent: #ef6f61;
      --grid-size: 24;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, #ffe6b8 0 12%, transparent 32%),
        radial-gradient(circle at 90% 85%, #cfeee4 0 10%, transparent 30%),
        var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4.6rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .subtitle {
      max-width: 210px;
      margin: 0;
      color: var(--muted);
      font-family: "Trebuchet MS", sans-serif;
      font-size: 0.8rem;
      line-height: 1.4;
      text-align: right;
      text-transform: uppercase;
    }

    .panel {
      padding: clamp(18px, 4vw, 30px);
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 10px 10px 0 #d8eee5;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .palette {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .swatch {
      width: 31px;
      height: 31px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 50%;
      background: var(--swatch);
      cursor: pointer;
      outline-offset: 3px;
      transition: transform 120ms ease, border-color 120ms ease;
    }

    .swatch:hover {
      transform: translateY(-2px);
    }

    .swatch.selected {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 3px var(--swatch), 0 0 0 2px var(--panel);
    }

    button.clear {
      padding: 9px 13px;
      border: 1px solid var(--ink);
      color: var(--ink);
      background: transparent;
      font: 700 0.75rem "Trebuchet MS", sans-serif;
      text-transform: uppercase;
      cursor: pointer;
    }

    button.clear:hover,
    button.clear:focus-visible {
      color: var(--panel);
      background: var(--ink);
    }

    .canvas-wrapper {
      width: 100%;
      aspect-ratio: 1;
      padding: 1px;
      border: 1px solid var(--ink);
      background: var(--ink);
      cursor: crosshair;
      touch-action: none;
      user-select: none;
    }

    .canvas {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(var(--grid-size), 1fr);
      grid-template-rows: repeat(var(--grid-size), 1fr);
      gap: 1px;
      background: var(--line);
    }

    .cell {
      min-width: 0;
      border: 0;
      padding: 0;
      background: #ffffff;
      cursor: crosshair;
    }

    .cell:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .status {
      min-height: 1.2em;
      margin: 16px 0 0;
      color: var(--muted);
      font: 0.75rem "Trebuchet MS", sans-serif;
      text-align: center;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      header {
        align-items: start;
        flex-direction: column;
        gap: 10px;
      }

      .subtitle {
        max-width: none;
        text-align: left;
      }

      .toolbar {
        align-items: start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Colouring<br>Game</h1>
      <p class="subtitle">Choose a colour, then fill the little squares.</p>
    </header>

    <section class="panel" aria-label="Colouring canvas">
      <div class="toolbar">
        <div class="palette" aria-label="Colour palette">
          <button class="swatch selected" type="button" data-color="#ef6f61" style="--swatch: #ef6f61" aria-label="Coral" aria-pressed="true"></button>
          <button class="swatch" type="button" data-color="#f5b841" style="--swatch: #f5b841" aria-label="Yellow" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#65c18c" style="--swatch: #65c18c" aria-label="Green" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#53a8d8" style="--swatch: #53a8d8" aria-label="Blue" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#9b7ede" style="--swatch: #9b7ede" aria-label="Purple" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#20252b" style="--swatch: #20252b" aria-label="Charcoal" aria-pressed="false"></button>
        </div>
        <button class="clear" id="clear-button" type="button">Clear</button>
      </div>

      <div class="canvas-wrapper" id="canvas-wrapper" aria-label="Colouring grid">
        <div class="canvas" id="canvas"></div>
      </div>
      <p class="status" id="status" aria-live="polite">Coral selected</p>
    </section>
  </main>

  <script>
    const canvas = document.querySelector('#canvas');
    const canvasWrapper = document.querySelector('#canvas-wrapper');
    const clearButton = document.querySelector('#clear-button');
    const status = document.querySelector('#status');
    const swatches = document.querySelectorAll('.swatch');
    const gridSize = 24;
    let selectedColor = swatches[0].dataset.color;
    let isMouseDown = false;

    function paintCell(cell) {
      cell.style.backgroundColor = selectedColor;
    }

    for (let index = 0; index < gridSize * gridSize; index += 1) {
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.type = 'button';
      cell.setAttribute('aria-label', `Grid square ${index + 1}`);
      cell.addEventListener('click', () => paintCell(cell));
      cell.addEventListener('mouseover', () => {
        if (isMouseDown && selectedColor) {
          paintCell(cell);
        }
      });
      canvas.appendChild(cell);
    }

    swatches.forEach((swatch) => {
      swatch.addEventListener('click', () => {
        selectedColor = swatch.dataset.color;
        swatches.forEach((item) => {
          const isSelected = item === swatch;
          item.classList.toggle('selected', isSelected);
          item.setAttribute('aria-pressed', String(isSelected));
        });
        status.textContent = `${swatch.getAttribute('aria-label')} selected`;
      });
    });

    canvasWrapper.addEventListener('mousedown', () => {
      isMouseDown = true;
    });

    document.addEventListener('mouseup', () => {
      isMouseDown = false;
    });

    clearButton.addEventListener('click', () => {
      canvas.querySelectorAll('.cell').forEach((cell) => {
        cell.style.backgroundColor = '#ffffff';
      });
      status.textContent = 'Canvas cleared';
    });
  </script>
</body>
</html>
